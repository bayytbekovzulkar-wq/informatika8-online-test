name = "informatika8-online-test"
compatibility_date = "2024-09-23"
pages_build_output_dir = "dist"

# Подключение базы данных Cloudflare D1
# После создания базы выполните: wrangler d1 create informatika8-db
# и замените database_id ниже на полученный идентификатор (UUID).
[[d1_databases]]
binding = "DB"
database_name = "informatika8-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

[vars]
# Длительность сессии учителя и ученика в часах
SESSION_TTL_HOURS = "8"
# Имя платформы
APP_NAME = "Informatika 8 — Online Test"
# Опционально: публичный ключ Cloudflare Turnstile (оставьте пустым, если Turnstile не подключён)
TURNSTILE_SITE_KEY = ""

# Секретные переменные (SESSION_SECRET, TURNSTILE_SECRET_KEY, INITIAL_SETUP_TOKEN)
# задавайте через Cloudflare Dashboard -> Pages -> Settings -> Environment Variables (Encrypt)
# или локально в файле .dev.vars (см. .env.example).
